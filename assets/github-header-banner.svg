<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <defs>
    <!-- Background Gradient matching GitHub Dark Palette -->
    <linearGradient id="ghBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0C10" />
      <stop offset="50%" stop-color="#0E1218" />
      <stop offset="100%" stop-color="#080A0E" />
    </linearGradient>

    <!-- Subtle Architectural Grid -->
    <pattern id="archGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.025)" stroke-width="1" />
    </pattern>

    <!-- Ambient Silver Backlight -->
    <radialGradient id="silverGlow" cx="82%" cy="45%" r="55%">
      <stop offset="0%" stop-color="rgba(148, 163, 184, 0.1)" />
      <stop offset="100%" stop-color="rgba(0, 0, 0, 0)" />
    </radialGradient>

    <!-- Terminal Gradients -->
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12161F" />
      <stop offset="100%" stop-color="#0A0D13" />
    </linearGradient>

    <linearGradient id="serverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2634" />
      <stop offset="100%" stop-color="#0F141C" />
    </linearGradient>
  </defs>

  <style><![CDATA[
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .font-mono { font-family: "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }

    @keyframes calm-hover {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-6px);
      }
    }

    @keyframes server-drift {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-3px);
      }
    }

    .anim-terminal {
      animation: calm-hover 6s ease-in-out infinite;
      transform-origin: 1020px 150px;
    }

    .anim-server {
      animation: server-drift 8s ease-in-out infinite;
      transform-origin: 1040px 110px;
    }
  ]]></style>

  <!-- Base Canvas -->
  <rect width="1200" height="300" rx="8" fill="url(#ghBg)" />
  <rect width="1200" height="300" rx="8" fill="url(#silverGlow)" />
  <rect width="1200" height="300" rx="8" fill="url(#archGrid)" />

  <!-- Outer Hairline Frame Border -->
  <rect x="12" y="12" width="1176" height="276" rx="6" fill="none" stroke="rgba(255, 255, 255, 0.07)" stroke-width="1" />

  <!-- ================= LEFT SIDE: METADATA &amp; TYPOGRAPHY ================= -->

  <!-- Top Metadata Bar -->
  <g transform="translate(48, 44)">
    <rect width="6" height="6" fill="#8B949E" />
    <text x="16" y="7" fill="#8B949E" font-size="11" font-weight="600" letter-spacing="1.5" class="font-mono">PRACTICE // 01 • INDEPENDENT TECHNICAL CONSULTANT</text>
    <text x="760" y="7" fill="#6E7681" font-size="11" font-weight="500" letter-spacing="1" class="font-mono">STATUS: ACCEPTING SELECTIVE ENGAGEMENTS</text>
  </g>

  <!-- Divider Line -->
  <line x1="48" y1="62" x2="840" y2="62" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1" />

  <!-- Primary Name -->
  <text x="48" y="118" fill="#F0F6FC" font-size="38" font-weight="700" letter-spacing="-0.5" class="font-sans">
    VINAYAK BHARDWAJ
  </text>

  <!-- Title / Focus -->
  <text x="48" y="152" fill="#8B949E" font-size="17" font-weight="500" letter-spacing="0.3" class="font-sans">
    Founder &amp; Technical Consultant
  </text>

  <!-- Mission Statement -->
  <text x="48" y="190" fill="#C9D1D9" font-size="14.5" font-weight="400" class="font-sans">
    Partnering with founders and engineering leaders to design, build, and deploy production software.
  </text>
  <text x="48" y="212" fill="#6E7681" font-size="13" font-weight="400" class="font-sans">
    Focused on maintainable architecture, cloud infrastructure, and pragmatic engineering execution.
  </text>

  <!-- Practice Areas (Clean pills, zero emojis) -->
  <g transform="translate(48, 238)">
    <g transform="translate(0, 0)">
      <rect width="160" height="28" rx="4" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
      <text x="14" y="18" fill="#E6EDF3" font-size="11.5" font-weight="500" class="font-sans">System Architecture</text>
    </g>

    <g transform="translate(172, 0)">
      <rect width="168" height="28" rx="4" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
      <text x="14" y="18" fill="#E6EDF3" font-size="11.5" font-weight="500" class="font-sans">Full-Stack Engineering</text>
    </g>

    <g transform="translate(352, 0)">
      <rect width="160" height="28" rx="4" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
      <text x="14" y="18" fill="#E6EDF3" font-size="11.5" font-weight="500" class="font-sans">Cloud Infrastructure</text>
    </g>

    <g transform="translate(524, 0)">
      <rect width="150" height="28" rx="4" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
      <text x="14" y="18" fill="#E6EDF3" font-size="11.5" font-weight="500" class="font-sans">Technical Advisory</text>
    </g>
  </g>


  <!-- ================= RIGHT SIDE: 3D FLOATING TECH WORKSPACE &amp; TERMINAL ================= -->
  
  <line x1="875" y1="36" x2="875" y2="264" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" stroke-dasharray="4 6" />

  <g transform="translate(895, 44)">
    <text x="0" y="7" fill="#484F58" font-size="9.5" font-weight="600" letter-spacing="1.5" class="font-mono">WORKSPACE // ISOMETRIC CONSOLE</text>
    <text x="250" y="7" text-anchor="end" fill="#30363D" font-size="9.5" font-weight="500" class="font-mono">3D FLOATING</text>
  </g>

  <g transform="translate(895, 260)">
    <text x="0" y="0" fill="#30363D" font-size="9.5" font-weight="500" letter-spacing="1" class="font-mono">SYS.KERNEL: RUNNING</text>
    <text x="250" y="0" text-anchor="end" fill="#484F58" font-size="9.5" font-weight="600" class="font-mono">[CLUSTER 01]</text>
  </g>

  <!-- 3D Isometric Ground Grid Plane -->
  <g opacity="0.35" transform="translate(1025, 225)">
    <path d="M -110 0 L 0 -22 L 110 0 L 0 22 Z" fill="none" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
    <path d="M -70 -8 L 0 -22 L 70 -8" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="0.8" />
    <path d="M -70 8 L 0 22 L 70 8" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="0.8" />
  </g>

  <!-- LAYER 1: Background 3D Server Node (Drifts with slow calm parallax) -->
  <g class="anim-server" transform="translate(1050, 68)">
    <animateTransform attributeName="transform" type="translate" values="1050 68; 1050 64; 1050 68" dur="9s" repeatCount="indefinite" />
    
    <!-- Shadow -->
    <polygon points="40,32 80,18 80,76 40,90" fill="#030406" opacity="0.5" />

    <!-- Isometric Server Chassis Top Face -->
    <polygon points="40,0 80,14 40,28 0,14" fill="#283244" stroke="rgba(255, 255, 255, 0.18)" stroke-width="1" />
    
    <!-- Isometric Server Chassis Left Face -->
    <polygon points="0,14 40,28 40,86 0,72" fill="#141A24" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
    
    <!-- Isometric Server Chassis Right Face (Front Interface) -->
    <polygon points="40,28 80,14 80,72 40,86" fill="url(#serverGrad)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1" />

    <!-- Server Rack Slots &amp; LED Lights on Right Face -->
    <line x1="46" y1="38" x2="74" y2="28" stroke="rgba(255, 255, 255, 0.18)" stroke-width="1.5" />
    <circle cx="48" cy="37" r="1.5" fill="#22C55E">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    
    <line x1="46" y1="52" x2="74" y2="42" stroke="rgba(255, 255, 255, 0.18)" stroke-width="1.5" />
    <circle cx="48" cy="51" r="1.5" fill="#38BDF8">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1.5s" repeatCount="indefinite" />
    </circle>

    <line x1="46" y1="66" x2="74" y2="56" stroke="rgba(255, 255, 255, 0.18)" stroke-width="1.5" />
    <circle cx="48" cy="65" r="1.5" fill="#A855F7">
      <animate attributeName="opacity" values="1;0.6;1" dur="2.4s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- LAYER 2: Foreground Floating 3D Code Terminal Console -->
  <g class="anim-terminal" transform="translate(908, 92)">
    <animateTransform attributeName="transform" type="translate" values="908 92; 908 85; 908 92" dur="7s" repeatCount="indefinite" />
    
    <!-- 3D Bottom Depth Shadow -->
    <rect x="0" y="4" width="224" height="136" rx="6" fill="#020305" opacity="0.7" />

    <!-- Terminal Main Body -->
    <rect x="0" y="0" width="224" height="136" rx="6" fill="url(#termBg)" stroke="rgba(255, 255, 255, 0.14)" stroke-width="1" />

    <!-- Window Header Titlebar -->
    <path d="M 0 6 C 0 2.68 2.68 0 6 0 L 218 0 C 221.32 0 224 2.68 224 6 L 224 24 L 0 24 Z" fill="rgba(255, 255, 255, 0.04)" />
    <line x1="0" y1="24" x2="224" y2="24" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

    <!-- Minimalist Window Buttons -->
    <circle cx="14" cy="12" r="3" fill="#EF4444" opacity="0.8" />
    <circle cx="24" cy="12" r="3" fill="#F59E0B" opacity="0.8" />
    <circle cx="34" cy="12" r="3" fill="#10B981" opacity="0.8" />

    <!-- Window Title -->
    <text x="112" y="15" text-anchor="middle" fill="#8B949E" font-size="9" font-weight="500" class="font-mono">
      vinayak@cloud: ~/architecture
    </text>

    <!-- Terminal Code Execution Body -->
    <g transform="translate(14, 42)">
      <!-- Line 1: Command prompt -->
      <text x="0" y="0" fill="#6E7681" font-size="9.5" class="font-mono">$</text>
      <text x="12" y="0" fill="#E6EDF3" font-size="9.5" font-weight="500" class="font-mono">init system --prod</text>

      <!-- Line 2: Cloud status -->
      <text x="0" y="18" fill="#38BDF8" font-size="9" class="font-mono">&gt;</text>
      <text x="12" y="18" fill="#8B949E" font-size="9" class="font-mono">cloud: cluster online</text>
      <circle cx="160" cy="15" r="2.5" fill="#22C55E" />

      <!-- Line 3: Latency &amp; Nodes -->
      <text x="0" y="34" fill="#38BDF8" font-size="9" class="font-mono">&gt;</text>
      <text x="12" y="34" fill="#8B949E" font-size="9" class="font-mono">latency: 12ms [stable]</text>

      <!-- Line 4: Final Ready Status -->
      <text x="0" y="52" fill="#22C55E" font-size="9" font-weight="600" class="font-mono">✓</text>
      <text x="12" y="52" fill="#F0F6FC" font-size="9" font-weight="600" class="font-mono">ready for traffic</text>

      <!-- Blinking Terminal Cursor -->
      <rect x="114" y="44" width="5.5" height="10" fill="#E6EDF3">
        <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite" />
      </rect>

      <!-- Memory/CPU Meter Bar -->
      <g transform="translate(0, 68)">
        <text x="0" y="6" fill="#484F58" font-size="8.5" class="font-mono">CPU</text>
        <rect x="26" y="0" width="70" height="7" rx="2" fill="rgba(255, 255, 255, 0.06)" />
        <rect x="26" y="0" width="28" height="7" rx="2" fill="rgba(255, 255, 255, 0.28)" />

        <text x="108" y="6" fill="#484F58" font-size="8.5" class="font-mono">RAM</text>
        <rect x="134" y="0" width="58" height="7" rx="2" fill="rgba(255, 255, 255, 0.06)" />
        <rect x="134" y="0" width="22" height="7" rx="2" fill="rgba(56, 189, 248, 0.35)" />
      </g>
    </g>
  </g>

</svg>